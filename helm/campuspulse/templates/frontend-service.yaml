apiVersion: v1
kind: Service
metadata:
  name: {{ include "campuspulse.fullname" . }}-frontend
  labels:
    {{- include "campuspulse.labels" . | nindent 4 }}
    app: campuspulse-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: campuspulse-frontend
