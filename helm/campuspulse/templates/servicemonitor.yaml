{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "campuspulse.fullname" . }}-backend
  labels:
    {{- include "campuspulse.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      app: campuspulse-backend
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: 10s
{{- end }}
