apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuspulse-backend
  namespace: campuspulse
  labels:
    app: campuspulse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campuspulse-backend
  template:
    metadata:
      labels:
        app: campuspulse-backend
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/abhiroop-011/campuspulse-backend:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://campuspulse:campuspulse_prod_secure_pass@campuspulse-postgres:5432/campuspulse_db"
            - name: ENVIRONMENT
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuspulse-frontend
  namespace: campuspulse
  labels:
    app: campuspulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campuspulse-frontend
  template:
    metadata:
      labels:
        app: campuspulse-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/abhiroop-011/campuspulse-frontend:latest
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
